name: Nightly Research Digest

# Runs every night and commits a fresh digest so it is waiting for you in the morning.
on:
  schedule:
    # 05:00 UTC daily. Adjust to run before you wake up (this is a UTC cron).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Generate digest
        env:
          # Add whichever one you use as a repository secret:
          # Settings -> Secrets and variables -> Actions -> New repository secret
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Provided automatically; raises GitHub API rate limits for code discovery.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: research-digest run

      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests
          if git diff --cached --quiet; then
            echo "No new digest to commit."
          else
            git commit -m "Nightly research digest $(date -u +%Y-%m-%d)"
            git push
          fi
